---
# become:true makes ansible_facts.user_id return root;
# target_user is hardcoded.
target_user: "yuez"

# keyd group membership requires a re-login before
# keyd-application-mapper works.
user_groups:
  - wheel
  - docker
  - input
  - video
  - render
  - network
  - audio
  - tty
  - keyd

optional_services: []

vm_services:
  - cloud-init-local.service
  - cloud-init-main.service
  - cloud-init-network.service
  - cloud-config.service
  - cloud-final.service
  - qemu-guest-agent.service

# Consumed by bootstrap.sh, not Ansible.
dotfiles_repo: "https://github.com/zgs225/dotfiles.git"

dotfiles_branch: "master"

# bootstrap.sh dies without an age identity at
# ~/.config/chezmoi/key.txt (or $AGE_KEY_FILE).
dotfiles_use_encryption: true

# xrdp VNC backend shares :0; autologin must be on for that chain.
display_autologin_enabled: false

display_manager: lightdm

# xrdp-sesman is disabled; no separate X sessions.
xrdp_enabled: true
