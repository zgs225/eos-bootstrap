---
- name: Deploy lightdm.conf
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm.conf
    content: |
      [Seat:*]
      session-wrapper=/etc/lightdm/Xsession
      greeter-session=lightdm-gtk-greeter
      user-session=i3
    owner: root
    group: root
    mode: "0644"
  tags: [display, lightdm]

- name: Deploy lightdm-gtk-greeter.conf
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm-gtk-greeter.conf
    content: |
      [greeter]
      background = /usr/share/backgrounds/default.png
      theme-name = catppuccin-glass
      icon-theme-name = Papirus-Dark
      font-name = LXGW WenKai 10
      position = 50%,center 55%,center
      indicators = ~host;~spacer;~clock;~spacer;~a11y;~power
      # collapse the avatar column; the ticket is a narrow plaque,
      # the wallpaper carries the portrait-scale imagery (2026-08-05)
      hide-user-image = true
    owner: root
    group: root
    mode: "0644"
  tags: [display, lightdm]

- name: Enable lightdm.service (starts on next boot)
  ansible.builtin.systemd:
    name: lightdm.service
    enabled: true
    daemon_reload: true
  tags: [display, lightdm]
