# Managed by eos-bootstrap (fingerprint role).
# deny: pam_faillock default (3) is too aggressive when fingerprint is the
# primary unlock — missed fingerprint windows (empty Enter, auto-lock while
# away) count as failures and would lock the account after 3 occurrences.
# unlock_time: default 600s lockout also blocks fingerprint unlock (faillock
# preauth runs first in /etc/pam.d/i3lock), turning a mistyped password into
# a 10-minute lockout. 60s keeps brute-force throttling with tolerable UX.
deny = 5
unlock_time = 60
