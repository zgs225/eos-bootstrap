---
# No-op when the USB device is absent.

- name: Detect FocalTech FT9366 fingerprint sensor via lsusb
  ansible.builtin.shell: |
    set -o pipefail
    lsusb 2>/dev/null | grep -q '{{ fingerprint_usb_vid }}:{{ fingerprint_usb_pid }}'
  register: fingerprint_hw_check
  changed_when: false
  failed_when: fingerprint_hw_check.rc not in [0, 1]
  check_mode: false
  tags: [fingerprint]

- name: Fingerprint sensor not detected — skipping role
  ansible.builtin.debug:
    msg: "No FocalTech FT9366 ({{ fingerprint_usb_vid }}:{{ fingerprint_usb_pid }}) found; skipping."
  when: fingerprint_hw_check.rc != 0
  tags: [fingerprint]

- name: Check if driver stack is already deployed
  when: fingerprint_hw_check.rc == 0
  ansible.builtin.shell: |
    set -o pipefail
    test -f '{{ fingerprint_driver_path }}' &&
    test -f '{{ fingerprint_shim_path }}' &&
    patchelf --print-needed '{{ fingerprint_driver_path }}' | grep -q 'focaltech-shim.so'
  register: fingerprint_installed_check
  changed_when: false
  failed_when: fingerprint_installed_check.rc not in [0, 1]
  check_mode: false
  tags: [fingerprint]

- name: Build and deploy FocalTech FT9366 driver stack
  when:
    - fingerprint_hw_check.rc == 0
    - fingerprint_installed_check.rc != 0
  tags: [fingerprint]
  block:
    - name: Install fprintd and build dependencies
      community.general.pacman:
        name:
          - fprintd
          - libfprint
          - gcc
          - pkgconf
          - libgusb
          - patchelf
        state: present

    - name: Create build directory
      ansible.builtin.file:
        path: "{{ fingerprint_build_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Clone focaltech-ft9366-arch-shim repository
      ansible.builtin.git:
        repo: "{{ fingerprint_shim_repo }}"
        dest: "{{ fingerprint_build_dir }}/src"
        version: "{{ fingerprint_shim_repo_version }}"
        depth: 1

    - name: Compile compatibility shim
      ansible.builtin.shell: |
        set -o pipefail
        gcc -shared -fPIC \
          -Wl,--version-script=shim.map \
          -o focaltech-shim.so shim.c \
          $(pkg-config --cflags --libs glib-2.0) -ldl
      args:
        chdir: "{{ fingerprint_build_dir }}/src"
        creates: "{{ fingerprint_build_dir }}/src/focaltech-shim.so"

    - name: Deploy proprietary driver
      ansible.builtin.copy:
        src: "{{ fingerprint_build_dir }}/src/libfprint-2.so.2.0.0"
        dest: "{{ fingerprint_driver_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart fprintd

    - name: Deploy compatibility shim
      ansible.builtin.copy:
        src: "{{ fingerprint_build_dir }}/src/focaltech-shim.so"
        dest: "{{ fingerprint_shim_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart fprintd

    - name: Inject shim into proprietary driver via patchelf
      ansible.builtin.command:
        cmd: "patchelf --add-needed focaltech-shim.so {{ fingerprint_driver_path }}"
      changed_when: true
      notify: Restart fprintd

- name: Ensure runtime configuration (fast path, always idempotent)
  when: fingerprint_hw_check.rc == 0
  tags: [fingerprint]
  block:
    - name: Deploy udev rules (device access)
      ansible.builtin.copy:
        src: "{{ fingerprint_build_dir }}/src/60-libfprint-2.rules"
        dest: /etc/udev/rules.d/60-libfprint-2.rules
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      notify: Reload udev

    - name: Deploy udev rules (USB autosuspend between verify windows)
      # control=auto, not "on": the TOD chip wedges under repeated verify
      # cycles and needs power-down rest between uses (see file comment).
      ansible.builtin.copy:
        src: 80-focaltech-autosuspend.rules
        dest: /etc/udev/rules.d/80-focaltech-autosuspend.rules
        owner: root
        group: root
        mode: "0644"
      notify: Reload udev

    - name: Deploy fingerprint sensor recovery script (xHCI power cycle)
      # When the sensor wedges ("abnormality interrup flag" flood, zero
      # captures), only a full xHCI controller reset clears it — verified
      # 2026-08-06 against fprintd restart and device unbind/bind.
      ansible.builtin.copy:
        src: focaltech-recover
        dest: /usr/local/sbin/focaltech-recover
        owner: root
        group: root
        mode: "0755"

    - name: Allow target_user to run focaltech-recover without password
      ansible.builtin.template:
        src: focaltech-recover.sudoers.j2
        dest: /etc/sudoers.d/focaltech-recover
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Deploy suspend/resume hook (restart fprintd after resume)
      ansible.builtin.copy:
        src: focaltech-fprint-resume
        dest: /usr/lib/systemd/system-sleep/focaltech-fprint-resume
        owner: root
        group: root
        mode: "0755"

    - name: Enable fprintd service
      ansible.builtin.systemd:
        name: fprintd.service
        enabled: true

    - name: Remove pam_fprintd from system-auth if present (breaks getty autologin)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/system-auth
        regexp: "^auth\\s+.*pam_fprintd\\.so"
        state: absent

    - name: Configure PAM for fingerprint authentication (per-service only)
      # Per-service instead of system-auth: pam_fprintd in system-auth probes
      # the reader on every auth stack walk and broke getty autologin.
      ansible.builtin.lineinfile:
        path: "/etc/pam.d/{{ item }}"
        line: "auth      sufficient                    pam_fprintd.so"
        insertbefore: "^auth"
        state: present
      loop:
        - sudo
      notify: Restart fprintd

    - name: Deploy PAM config for i3lock (stock, password-only)
      # Lock-screen fingerprint removed: FT9366 wedges permanently after ~2 verify cycles on this hardware.
      ansible.builtin.copy:
        src: i3lock-pam
        dest: /etc/pam.d/i3lock
        owner: root
        group: root
        mode: "0644"

    - name: Remove fingerprint-era faillock tuning (restore distro defaults)
      ansible.builtin.file:
        path: /etc/security/faillock.conf
        state: absent

    - name: Deploy PAM config for polkit (fingerprint in polkit prompts)
      # /etc/pam.d/polkit-1 does not exist by default; deploy a full file, not lineinfile.
      ansible.builtin.copy:
        src: polkit-1
        dest: /etc/pam.d/polkit-1
        owner: root
        group: root
        mode: "0644"
      notify: Restart fprintd

    - name: Deploy driver-restore script (runs from pacman hook)
      ansible.builtin.copy:
        src: focaltech-restore-driver
        dest: /usr/local/sbin/focaltech-restore-driver
        owner: root
        group: root
        mode: "0755"

    - name: Ensure /etc/pacman.d/hooks exists
      ansible.builtin.file:
        path: /etc/pacman.d/hooks
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy pacman hook (restore driver after libfprint upgrades)
      # /usr/lib/libfprint-2.so.2.0.0 is owned by the libfprint package;
      # every upgrade wipes the shim-injected proprietary driver.
      ansible.builtin.copy:
        src: focaltech-libfprint-restore.hook
        dest: /etc/pacman.d/hooks/focaltech-libfprint-restore.hook
        owner: root
        group: root
        mode: "0644"
