<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Default generic-family stacks (eos-bootstrap role `fonts`).
     Deployed to /etc/fonts/local.conf, which conf.d/51-local.conf includes at
     position 51 — before 60-latin.conf/60-generic.conf, so these <prefer>
     lists outrank the distro's generic-family lists. A copy placed at 60 or
     later silently loses to 60-latin.conf; a user override in
     ~/.config/fontconfig/fonts.conf (loaded earlier, via 50-user.conf)
     deliberately still wins. Explicit Windows/Office family requests are
     handled by conf.d/59-ms-cjk-alias.conf and are not touched here. -->
<fontconfig>
  <description>Default sans-serif, serif and monospace stacks</description>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans CJK SC</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Han Serif CN</family>
      <family>Noto Serif CJK SC</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>LXGW WenKai Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
