---
# Tags appear twice per block by design: on the include statement and in
# apply: (propagates them to the dynamically included inner tasks).
- name: Configure sysctl
  ansible.builtin.include_tasks:
    file: sysctl.yml
    apply:
      tags: [kernel, sysctl]
  tags: [kernel, sysctl]

- name: Configure modules-load
  ansible.builtin.include_tasks:
    file: modules.yml
    apply:
      tags: [kernel, modules]
  tags: [kernel, modules]

- name: Configure zram-generator
  ansible.builtin.include_tasks:
    file: zram.yml
    apply:
      tags: [kernel, zram]
  tags: [kernel, zram]

# /etc/kernel/cmdline is a systemd-boot/UKI (kernel-install) artifact. GRUB
# hosts keep their command line in /etc/default/grub, so it is not there.
- name: Configure kernel command line
  ansible.builtin.include_tasks:
    file: cmdline.yml
    apply:
      tags: [kernel, cmdline]
  tags: [kernel, cmdline]
  when: kernel_cmdline_path is file

- name: Configure /tmp backing store
  ansible.builtin.include_tasks:
    file: tmpdir.yml
    apply:
      tags: [kernel, tmpdir]
  tags: [kernel, tmpdir]
