---
# The vars/ directory is intentionally NOT used for these lists: Ansible
# only auto-loads vars/main.yml from a role, not sibling files like
# vars/pacman_packages.yml.

# ParallelDownloads is tuned by the same subtask: 5 parallel streams
# saturate the single-TCP vmess-wss tunnel (head-of-line blocking), which
# stalls small .sig files for >10s and trips pacman's low-speed abort.
pacman_parallel_downloads: 3

# Kernel packages pinned via IgnorePkg (tasks/pacman-mirrors.yml).
# Unpin together as one batch: linux, linux-headers and the whole
# nvidia-open driver stack are build-linked (nvidia-open's modules must
# match the kernel vermagic, and nvidia-open hard-pins
# nvidia-utils=<driver-version>). Pinning nvidia-open alone is NOT enough:
# an unpinned nvidia-utils upgrades on its own and breaks the exact
# dependency ("installing nvidia-utils (X) breaks dependency
# 'nvidia-utils=Y' required by nvidia-open", 2026-10-12). nvidia-settings,
# libxnvctrl and opencl-nvidia ship from the same driver release and must
# stay in lockstep to avoid user/kernel-space driver skew.
# Reason: kernel 7.2.9 broke USB enumeration of the MT7922 combo card's
# Bluetooth function (13d3:3568) - "descriptor read/64, error -110/-62",
# no hci0, bluetooth.service skipped (2026-10-08). We rolled back to
# 7.2.7 cached packages. Upgrade to a fixed release (7.2.10+) as a
# single transaction and verify bluetooth before removing this pin.
pacman_ignore_pkg:
  - linux
  - linux-headers
  - nvidia-open
  - nvidia-utils
  - nvidia-settings
  - libxnvctrl
  - opencl-nvidia

# Overseas-only pacman mirrors (/etc/pacman.d/mirrorlist), rendered by
# templates/pacman/mirrorlist.j2 (tasks/pacman-mirrors.yml). Ordered by
# measured download speed through the TUN proxy chain (2026-10-08);
# re-measure with e.g.
#   timeout 25 curl -so /dev/null --max-time 18 -w '%{speed_download}' \
#     https://<mirror>/<path>/extra/os/x86_64/extra.db
# and reorder. NOTE: *.mirror.pkgbuild.com and archlinux.mailtunnel.eu
# serve from the domain ROOT (no /archlinux prefix).
pacman_mirrors:
# mirror.osbeck.com dropped 2026-10-08: behind Cloudflare; through the
# jp1 proxy chain it repeatedly stalled/tripped HTTP/2 PROTOCOL_ERROR on
# small .sig files, sinking whole transactions twice.
  - https://mirror.rackspace.com/archlinux/$repo/os/$arch
  - https://mirrors.mit.edu/archlinux/$repo/os/$arch
  - https://archlinux.mailtunnel.eu/$repo/os/$arch
  - https://singapore.mirror.pkgbuild.com/$repo/os/$arch
  - https://taipei.mirror.pkgbuild.com/$repo/os/$arch
  - https://mirror.givebytes.net/archlinux/$repo/os/$arch

