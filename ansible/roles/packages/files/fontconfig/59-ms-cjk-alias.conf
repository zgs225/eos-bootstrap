<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 宋体/SimSun、黑体/SimHei、微软雅黑/MSYaHei、等线/DengXian are
     Windows/Office commercial fonts with no automated install path; bind
     them strongly to the installed Adobe CJK fonts so documents asking
     for these names render with real CJK faces instead of falling
     through to DejaVu. Serif names → 思源宋体, sans names → 思源黑体,
     等线/DengXian → 思源黑体 (closest available body-text sans).
     Localized names are listed too — WPS/Qt apps query the name as
     stored in the document, which for Chinese docs is the localized one. -->
<fontconfig>
  <alias binding="same">
    <family>SimSun</family>
    <accept><family>Source Han Serif CN</family></accept>
  </alias>
  <alias binding="same">
    <family>NSimSun</family>
    <accept><family>Source Han Serif CN</family></accept>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <accept><family>Source Han Serif CN</family></accept>
  </alias>
  <alias binding="same">
    <family>新宋体</family>
    <accept><family>Source Han Serif CN</family></accept>
  </alias>
  <alias binding="same">
    <family>SimHei</family>
    <accept><family>Source Han Sans CN</family></accept>
  </alias>
  <alias binding="same">
    <family>黑体</family>
    <accept><family>Source Han Sans CN</family></accept>
  </alias>
  <alias binding="same">
    <family>Microsoft YaHei</family>
    <accept><family>Source Han Sans CN</family></accept>
  </alias>
  <alias binding="same">
    <family>微软雅黑</family>
    <accept><family>Source Han Sans CN</family></accept>
  </alias>
  <alias binding="same">
    <family>DengXian</family>
    <accept><family>Source Han Sans CN</family></accept>
  </alias>
  <alias binding="same">
    <family>等线</family>
    <accept><family>Source Han Sans CN</family></accept>
  </alias>
</fontconfig>
