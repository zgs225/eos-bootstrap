<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Windows/Office CJK families are not installable (commercial), so two
     mechanisms cover them:

     1. REAL fonts whose family names ARE the Windows names, generated by
        roles/packages/files/ms_cjk_alias_fonts/generate_ms_cjk_alias_fonts.py
        into /usr/share/fonts/ms-cjk-alias/. This is what matters for WPS,
        which does its own font substitution and never reads the aliases below.
     2. The aliases in this file, for the apps that DO consult fontconfig
        (LibreOffice, GTK/Qt text stacks, …). They exist so a request for one of
        these names never falls through to DejaVu (which has no CJK glyphs) —
        fontconfig picks the target family only when the requested name has no
        glyph coverage.

     Serif/Song/仿宋 names → 思源宋体, sans/黑体 names → 思源黑体, kai names →
     霞鹜文楷. Localized names are listed too: apps query the name as stored in
     the document, which for Chinese documents is the localized one. -->
<fontconfig>
  <!-- 宋体系列 → 思源宋体 -->
  <alias binding="same"><family>SimSun</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>宋体</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>NSimSun</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>新宋体</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>STSong</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>华文宋体</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>STZhongsong</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>华文中宋</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>Songti SC</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>宋体-简</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>PMingLiU</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>新細明體</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>MingLiU</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>細明體</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>FZSSK</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>方正书宋_GBK</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>方正书宋简体</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>FZXiaoBiaoSong-B05</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>方正小标宋简体</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>方正小标宋_GBK</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>小标宋</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>LiSu</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>隶书</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>华文隶书</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>华文新魏</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>FZLSK</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>方正隶书_GBK</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>FZWBK</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>方正魏碑_GBK</family><accept><family>Source Han Serif CN</family></accept></alias>

  <!-- 仿宋（含 WPS 的通用回退族 FZFangSong/方正仿宋_GBK）→ 思源宋体 -->
  <alias binding="same"><family>FangSong</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>仿宋</family><accept><family>Source Han Serif CN</family></accept></alias>
