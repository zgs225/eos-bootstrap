<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- SimSun/NSimSun unavailable (Windows/Office commercial font); bind them
     strongly to the installed Source Han Serif CN so documents asking for
     宋体 render with a real serif CJK instead of falling through to DejaVu.
     Localized names are listed too — apps query the name as stored in the
     document, which for Chinese docs is usually the localized one. -->
<fontconfig>
  <alias binding="same">
    <family>SimSun</family>
    <accept><family>Source Han Serif CN</family></accept>
  </alias>
  <alias binding="same">
    <family>NSimSun</family>
    <accept><family>Source Han Serif CN</family></accept>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <accept><family>Source Han Serif CN</family></accept>
  </alias>
  <alias binding="same">
    <family>新宋体</family>
    <accept><family>Source Han Serif CN</family></accept>
  </alias>
</fontconfig>
