---
- name: Ensure /etc/keyd exists
  ansible.builtin.file:
    path: /etc/keyd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [packages, keyd]

- name: Deploy keyd system-wide configuration
  ansible.builtin.template:
    src: keyd/default.conf.j2
    dest: /etc/keyd/default.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload keyd
  tags: [packages, keyd]

- name: Deploy xclose-active-window helper for keyd command() macros
  ansible.builtin.copy:
    src: keyd/xclose-active-window
    dest: /usr/local/bin/xclose-active-window
    owner: root
    group: root
    mode: "0755"
  tags: [packages, keyd]

# keyd-application-mapper ships inside the keyd package at /usr/bin, where a
# pacman upgrade overwrites it. This patched copy lives in /usr/local/bin
# (ahead of /usr/bin in PATH) and makes two changes:
#
# 1. On i3 it follows the focused window through i3's IPC socket instead of
#    python-xlib. The xlib event loop can raise mid send_and_recv (e.g.
#    "Expected reply for request X, but got Y. Can't happen!"), and because
#    the callers swallow every exception the Display is left with stale
#    send_active/request_waiting flags. Every later ReplyRequest.reply() then
#    spins in a pure-python busy loop (100% of a core, no syscalls) and the
#    mapper silently stops updating per-app bindings. i3 IPC has no such
#    request/reply matching and reports focus/title/workspace changes
#    directly. It also reconnects and resyncs after an i3 restart.
#
# 2. The X fallback used by other sessions no longer favours a
#    _NET_WM_STATE_ABOVE floating window over the real X input focus, so a PiP
#    video / eww popup / any always-on-top window can no longer make the
#    mapper push wrong per-app bindings (wezterm Alt+v / Alt+[ / Alt+]).
#
# After keyd upgrades, diff/port the fixes forward:
# diff -u /usr/bin/keyd-application-mapper /usr/local/bin/keyd-application-mapper
- name: Deploy patched keyd-application-mapper (focus-following override)
  ansible.builtin.copy:
    src: keyd/keyd-application-mapper
    dest: /usr/local/bin/keyd-application-mapper
    owner: root
    group: root
    mode: "0755"
  tags: [packages, keyd]
  notify: Restart keyd-application-mapper
