---
# NOTE: tags appear twice per block by design: on the include statement
# (controls whether the include itself runs under --tags) and in apply:
# (propagates them to the dynamically included inner tasks, which would
# otherwise be filtered out as untagged).
- name: Install official packages
  ansible.builtin.include_tasks:
    file: pacman.yml
    apply:
      tags: [packages, pacman]
  tags: [packages, pacman]

- name: Configure audio
  ansible.builtin.include_tasks:
    file: audio.yml
    apply:
      tags: [packages, audio]
  tags: [packages, audio]

- name: Install Thunar file manager and extensions
  ansible.builtin.include_tasks:
    file: thunar.yml
    apply:
      tags: [packages, thunar]
  tags: [packages, thunar]

- name: Install AUR packages
  ansible.builtin.include_tasks:
    file: aur.yml
    apply:
      tags: [packages, aur]
  tags: [packages, aur]

- name: Install chongxi seal font
  ansible.builtin.include_tasks:
    file: chongxi_seal.yml
    apply:
      tags: [packages, chongxi_seal]
  tags: [packages, chongxi_seal]

- name: Detect VM environment
  ansible.builtin.include_tasks:
    file: vm_detect.yml
    apply:
      tags: [packages, vm]
  tags: [packages, vm]

- name: Conditionally install bluetooth
  ansible.builtin.include_tasks:
    file: bluetooth.yml
    apply:
      tags: [packages, bluetooth]
  tags: [packages, bluetooth]

- name: Configure Thunderbolt hotplug auto-authorization
  ansible.builtin.include_tasks:
    file: thunderbolt.yml
    apply:
      tags: [packages, thunderbolt]
  tags: [packages, thunderbolt]

- name: Configure keyd keyboard remapping
  ansible.builtin.include_tasks:
    file: keyd.yml
    apply:
      tags: [packages, keyd]
  tags: [packages, keyd]

- name: Configure sched-ext scheduler (scx_loader)
  ansible.builtin.include_tasks:
    file: scx.yml
    apply:
      tags: [packages, scx]
  tags: [packages, scx]

- name: Configure libinput quirks
  ansible.builtin.include_tasks:
    file: libinput.yml
    apply:
      tags: [packages, libinput]
  tags: [packages, libinput]

- name: Configure VM guest packages and services
  ansible.builtin.include_tasks:
    file: vm_services.yml
    apply:
      tags: [packages, vm]
  tags: [packages, vm]

- name: Conditionally install i915-sriov driver
  ansible.builtin.include_tasks:
    file: i915-sriov.yml
    apply:
      tags: [packages, i915-sriov]
  tags: [packages, i915-sriov]

- name: Conditionally install Sunshine for remote desktop
  ansible.builtin.include_tasks:
    file: sunshine.yml
    apply:
      tags: [packages, sunshine]
  tags: [packages, sunshine]

- name: Configure xrdp when xrdp_enabled is true
  ansible.builtin.include_tasks:
    file: xrdp.yml
    apply:
      tags: [packages, xrdp]
  when: xrdp_enabled | default(false) | bool
  tags: [packages, xrdp]
