---
# WPS does its own font substitution (its built-in table maps missing CJK
# families to a Western face; fontconfig aliases never get consulted), so
# documents in 宋体/SimHei/微软雅黑 render tofu blocks. Fix: expose real
# fonts whose family names ARE the Windows names, generated by renaming
# OFL sources (思源宋体/思源黑体/霞鹜文楷 — OFL permits renaming away from
# the Reserved Font Names). See files/ms_cjk_alias_fonts/generate_*.py.
# The fontconfig aliases (59-ms-cjk-alias.conf) stay in place for apps
# that do consult fontconfig.
- name: Install fontTools for alias font generation
  community.general.pacman:
    name: python-fonttools
    state: present
  tags: [packages, ms-cjk-alias]

- name: Generate Windows-name alias fonts
  become: true
  ansible.builtin.script:
    cmd: ms_cjk_alias_fonts/generate_ms_cjk_alias_fonts.py
  changed_when: "'generated' in packages_ms_cjk_alias_gen.stdout"
  failed_when: packages_ms_cjk_alias_gen.rc != 0
  register: packages_ms_cjk_alias_gen
  notify: Refresh font cache
  tags: [packages, ms-cjk-alias]
