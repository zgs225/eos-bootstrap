---
# WPS does its own font substitution: it never consults fontconfig aliases, and
# for a family it does not have it falls back to ONE generic CJK face —
# 方正仿宋_GBK — which ships a single weight. On a bold run WPS then finds no
# Bold face in the resolved family and synthesises one itself, and its synthetic
# bold inflates the strokes until every glyph becomes a solid black rectangle
# ("黑块"). So the breakage is not "font missing" — it is "resolved family has no
# real Bold face".
# Fix: expose real fonts whose family names ARE the Windows/Office names, built
# by renaming OFL sources (思源黑体/思源宋体/霞鹜文楷 — OFL permits renaming away
# from the Reserved Font Names; the non-OFL 方正 fonts are never used as
# sources). Every target family gets Regular AND Bold, with the OS/2 + head
# weight metadata normalised so WPS can actually find the bold face.
# See files/ms_cjk_alias_fonts/generate_ms_cjk_alias_fonts.py for the full
# family table (`--list` prints it with the disk cost per face — each face is a
# full copy of its source, so raising the tier is a disk-space decision).
# The fontconfig aliases (59-ms-cjk-alias.conf) stay in place for the apps that
# DO consult fontconfig.
- name: Install fontTools for alias font generation
  community.general.pacman:
    name: python-fonttools
    state: present
  tags: [packages, ms-cjk-alias]

- name: Generate Windows-name CJK alias fonts
  become: true
  ansible.builtin.script:
    cmd: ms_cjk_alias_fonts/generate_ms_cjk_alias_fonts.py
  environment:
    MS_CJK_ALIAS_TIER: "{{ ms_cjk_alias_tier | default(1) | string }}"
  changed_when: "'generated' in packages_ms_cjk_alias_gen.stdout"
  failed_when: packages_ms_cjk_alias_gen.rc != 0
  register: packages_ms_cjk_alias_gen
  notify: Refresh font cache
  tags: [packages, ms-cjk-alias]
