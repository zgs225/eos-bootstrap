---
# Deploy /etc/pacman.d/mirrorlist from the pacman_mirrors list
# (defaults/main.yml). Overseas-only by choice: traffic goes through
# the TUN proxy, so mirrors are picked/ordered by measured throughput
# on that chain. Re-measure (see comment in pacman-mirrors var) and
# reorder before changing.

- name: Tune ParallelDownloads in pacman.conf
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^\s*#?\s*ParallelDownloads\s*(=.*)?$'
    line: 'ParallelDownloads = {{ pacman_parallel_downloads }}'
    state: present

# Declarative in both directions: a non-empty pacman_ignore_pkg writes the
# line, an empty list removes it again (regexp only matches the active line,
# so the stock "#IgnorePkg =" sample comment in pacman.conf survives).
- name: Manage IgnorePkg in pacman.conf
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^\s*IgnorePkg\s*='
    line: 'IgnorePkg = {{ pacman_ignore_pkg | join(" ") }}'
    state: '{{ (pacman_ignore_pkg | length > 0) | ternary("present", "absent") }}'

- name: Deploy pacman mirrorlist
  ansible.builtin.template:
    src: pacman/mirrorlist.j2
    dest: /etc/pacman.d/mirrorlist
    owner: root
    group: root
    mode: "0644"
  notify: Refresh pacman databases

- name: Refresh pacman databases (mirror sanity check)
  ansible.builtin.command: pacman -Sy
  throttle: 1
  changed_when: false
