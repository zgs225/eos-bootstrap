---
# Fonts WITHOUT any AUR package: STXihei/STKaiti/STSong/STZhongsong/
# STFangsong/STXinwei/STCaiyun/STHupo/STLiti/STXingkai (华文系列),
# LiSu 隶书, YouYuan 幼圆, KaiTi_GB2312, FangSong_GB2312. They ship with
# Office 简体中文版, not Windows itself, so the ttf-ms-win11-* packages
# don't include them either. Keep them out of the automated-source path:
# the font files at files/wps_fonts/ are committed by hand (only from a
# properly licensed Windows/Office machine), then deployed here.
- name: Locate bundled no-package fonts
  ansible.builtin.find:
    paths: "{{ role_path }}/files/wps_fonts"
    patterns: ["*.ttf", "*.ttc", "*.otf"]
  register: packages_wps_fonts_found
  changed_when: false
  check_mode: false
  tags: [packages, wps_fonts]

- name: Ensure bundled-font directory exists
  become: true
  ansible.builtin.file:
    path: "{{ wps_fonts_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  notify: Refresh font cache
  tags: [packages, wps_fonts]

- name: Deploy bundled no-package fonts
  become: true
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ wps_fonts_install_dir }}/{{ item.filename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ packages_wps_fonts_found.files }}"
  loop_control:
    label: "{{ item.filename }}"
  notify: Refresh font cache
  tags: [packages, wps_fonts]
