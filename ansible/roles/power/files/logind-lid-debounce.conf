# Lid-close handling is delegated to lid-watchdog.service.
#
# This laptop's lid switch intermittently reports "closed" while the lid
# is open; the stock HandleLidSwitch=suspend turned each spurious pulse
# into an s2idle suspend mid-work. All three switches are set to ignore
# (docked was already ignore by default) and lid-watchdog.service is the
# only suspend-on-lid-close path, applying a debounce to filter pulses.
#
# Takes effect on systemd-logind restart (handled by the power role).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
