# Power button: a single tap does nothing; holding it for 5s powers off.
#
# systemd >= 256 distinguishes short/long presses in logind: on press it
# arms a 5s timer (LONG_PRESS_DURATION in logind-button.c, hard-coded, not
# configurable — see systemd issue #28100). If the key is released before
# the timer expires, the HandlePowerKey= action runs (ignore = no-op); if
# still held at 5s, the HandlePowerKeyLongPress= action fires immediately
# without waiting for release.
#
# Caveat: the laptop EC/firmware may force a hard power cut when the button
# is held beyond its Power Button Override timer (ACPI default ~4s; ASUS
# unverified). That cut is unconditional and beats the 5s software timer —
# if the machine ever hard-dies mid-hold before a graceful shutdown starts,
# the EC wins and this drop-in alone can't fix it.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
