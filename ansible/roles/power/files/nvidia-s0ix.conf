# Managed by Ansible (eos-bootstrap, roles/power). Manual edits will be overwritten.
#
# Hybrid NVIDIA laptop (ASUS N7600ZE / RTX 3050 Ti / nvidia-open 610.57).
#
# Problem history
# ---------------
# 2026-08-27: lid-close suspend hung inside nvidia-modeset ("Error while
#   waiting for GPU progress"). Fixed by enabling S0ix here.
#
# 2026-09-02: machine hung again, this time on AC<->BAT power-source change:
#   NVRM rm_power_source_change_event "Failed to handle Power Source change
#   event, status=0x65" -> GSP heartbeat timeout -> GPU marked for reset ->
#   every later GPU touch (lock screen DPMS) wedged the X session.
#
# Root cause of the *2026-08-27 fix not working*: nvidia is force-loaded from
# the initramfs (dracut force_drivers), so module options must live inside the
# initramfs image. The image is hostonly, and dracut's 80base module only
# packs /etc/modprobe.d/*.conf at build time. This file was created 2026-08-27
# but the initramfs was never rebuilt (image dated 2026-08-23), so the option
# never reached the module. Verified: /proc/driver/nvidia/params showed
# EnableS0ixPowerManagement=0 despite this file saying 1.
#
# Fix
# ---
# 1. Complete the power-management set. DynamicPowerManagement=3 (RTD3 + dGPU
#    with no displays) was already active and left untouched; S0ix was the piece
#    that never applied. S0ix lets the GPU enter video-memory self-refresh on
#    s2idle; combined with RTD3 it parks the idle dGPU in D3 so it stays out of
#    the GSP power-source-change path.
# 2. This file is now ALSO installed into the initramfs by the dracut task in
#    this role (install_items += /etc/modprobe.d/nvidia-s0ix.conf), so the
#    early-loaded module sees these options. Requires initramfs rebuild +
#    reboot to take effect.
#
# Verify after reboot:
#   grep -E 'EnableS0ixPowerManagement|DynamicPowerManagement' /proc/driver/nvidia/params
# Expect:
#   EnableS0ixPowerManagement: 1
#   DynamicPowerManagement: 3        (unchanged)
options nvidia NVreg_EnableS0ixPowerManagement=1 NVreg_DynamicPowerManagement=0x03
