# Managed by Ansible (eos-bootstrap, roles/power). Manual edits will be overwritten.
#
# Hybrid NVIDIA laptops default to s2idle (Low-power S0). The nvidia-open
# module supports GPU S0ix (video-memory self-refresh) but ships with
# NVreg_EnableS0ixPowerManagement=0. Leaving it off while the platform
# suspends via s2idle caused a multi-minute hang inside nvidia-modeset
# ("Error while waiting for GPU progress") on lid-close — observed
# 2026-08-27 on ASUS N7600ZE / RTX 3050 Ti / nvidia-open 610.57.
#
# Requires reboot (or nvidia module reload) to take effect. Verify with:
#   grep -A2 'S0ix Power Management' /proc/driver/nvidia/gpus/*/power
# Expect: Status: Enabled
options nvidia NVreg_EnableS0ixPowerManagement=1
