# Managed by Ansible (eos-bootstrap, roles/power). Manual edits will be overwritten.

# --- Automatic profile switching -------------------------------------------
# AC -> balanced profile, battery -> power-saver.
#
# TLP maps a profile id onto a setting group: PRF reads the *_ON_AC values,
# BAL reads the *_ON_BAT values, SAV reads the *_ON_SAV values. So on AC the
# BAL profile is active and takes its settings from the *_ON_BAT variables.
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV

# --- CPU energy/performance preference (EPP) -------------------------------
# AC (BAL profile -> *_ON_BAT): balance_performance. Snappier interactive
# response than the balance_power default, without going full "performance".
# BAT (SAV profile -> *_ON_SAV): TLP default "power", battery life first.
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance

# --- Platform profile -------------------------------------------------------
# /sys/firmware/acpi/platform_profile is owned exclusively by the fan-profile
# tool (/usr/local/lib/fan-profile, boot default in /etc/fan-profile/default).
# Left empty so TLP does not write it: previously TLP (BAL -> balanced) and
# fan-profile.service (quiet) both wrote the same knob and raced at boot and
# on every AC/BAT switch, so the effective profile was unpredictable. Change
# it with `fan-profile set <quiet|balanced|performance>` instead.
PLATFORM_PROFILE_ON_AC=
PLATFORM_PROFILE_ON_BAT=
PLATFORM_PROFILE_ON_SAV=

# --- Battery care -----------------------------------------------------------
# Stop charging at 80% (ASUS honored values: 40/60/80).
STOP_CHARGE_THRESH_BAT0=80
