---
- name: Read installed TLP version
  ansible.builtin.command:
    cmd: "tlp --version"
  register: power_tlp_version
  changed_when: false
  tags: [power]

- name: Assert TLP >= 1.9 for profile support
  ansible.builtin.assert:
    that:
      - (power_tlp_version.stdout | regex_search('\\d+\\.\\d+(\\.\\d+)?') | default('0.0', true)) is version('1.9', '>=')
    fail_msg: "TLP >= 1.9 is required for power profiles; found: {{ power_tlp_version.stdout }}"
  tags: [power]

- name: Deploy TLP drop-in config
  ansible.builtin.copy:
    src: tlp-eos.conf
    dest: /etc/tlp.d/00-eos.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply tlp
  tags: [power]

- name: Deploy eww power admin helper
  ansible.builtin.copy:
    src: eww-power-admin
    dest: /usr/local/sbin/eww-power-admin
    owner: root
    group: root
    mode: "0755"
  tags: [power]

- name: Sudoers drop for eww power admin
  ansible.builtin.copy:
    content: "{{ target_user }} ALL=(root) NOPASSWD: /usr/local/sbin/eww-power-admin\n"
    dest: /etc/sudoers.d/eww-power
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags: [power]

# Lid-close suspend goes through lid-watchdog (debounce) instead of
# logind: the lid switch on this laptop intermittently reports "closed"
# while the lid is open, so the stock HandleLidSwitch=suspend drops the
# machine into s2idle mid-work (black screen, i915 firmware reload logs
# on resume). See files/lid-watchdog for the full history.
- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [power]

- name: Deploy logind lid debounce drop-in (delegates lid to lid-watchdog)
  ansible.builtin.copy:
    src: logind-lid-debounce.conf
    dest: /etc/systemd/logind.conf.d/10-lid-debounce.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart logind
  tags: [power]

- name: Deploy logind power key drop-in (tap ignored, 5s long press powers off)
  ansible.builtin.copy:
    src: logind-power-key.conf
    dest: /etc/systemd/logind.conf.d/20-power-key.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart logind
  tags: [power]

- name: Deploy lid-watchdog debounce script
  ansible.builtin.copy:
    src: lid-watchdog
    dest: /usr/local/sbin/lid-watchdog
    owner: root
    group: root
    mode: "0755"
  notify: Restart lid-watchdog
  tags: [power]

- name: Deploy lid-watchdog service unit
  ansible.builtin.copy:
    src: lid-watchdog.service
    dest: /etc/systemd/system/lid-watchdog.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for lid-watchdog
  tags: [power]

- name: Enable and start lid-watchdog service
  ansible.builtin.systemd:
    name: lid-watchdog.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [power]

# Lock-on-suspend: the system-sleep hook is the root half; it forwards to
# the session's lock-on-suspend.service user unit (chezmoi dotfiles repo),
# which has its own cgroup and survives the sleep — backgrounding the
# locker from a hook does not, systemd-suspend.service KillMode cleans up.
- name: Deploy lock-on-suspend system-sleep hook
  ansible.builtin.copy:
    src: sleep-lock
    dest: /etc/systemd/system-sleep/50-lock
    owner: root
    group: root
    mode: "0755"
  tags: [power]

# NVIDIA open + platform s2idle: enable GPU S0ix so lid-close suspend does
# not hang in nvidia-modeset waiting for GPU progress. Takes effect on
# next nvidia module load (reboot). Gated on NVIDIA PCI device presence.
#
# 2026-09-02 fix: nvidia is force-loaded from the initramfs (dracut
# force_drivers + hostonly image), so module options only take effect if they
# are inside the initramfs at build time. The 2026-08-27 fix added
# /etc/modprobe.d/nvidia-s0ix.conf but never rebuilt the initramfs (image was
# from 2026-08-23), so the option never reached the module. The tasks below
# therefore (1) mirror the modprobe drop-in into the initramfs explicitly via
# a dracut install_items conf and (2) notify an initramfs rebuild. hostonly
# dracut would pack /etc/modprobe.d/*.conf on its own, but install_items
# keeps the intent explicit and survives a switch to non-hostonly builds.
# Verified broken 2026-09-02: /proc/driver/nvidia/params showed
# EnableS0ixPowerManagement=0 although /etc/modprobe.d/nvidia-s0ix.conf said 1.
- name: Detect NVIDIA GPU via lspci
  ansible.builtin.shell: |
    set -o pipefail
    lspci -nn 2>/dev/null | grep -qiE '\[(0300|0302)\].*(10de|NVIDIA)'
  register: power_nvidia_hw_check
  changed_when: false
  failed_when: power_nvidia_hw_check.rc not in [0, 1]
  check_mode: false
  tags: [power, nvidia-s0ix]

- name: Deploy nvidia S0ix modprobe drop-in
  ansible.builtin.copy:
    src: nvidia-s0ix.conf
    dest: /etc/modprobe.d/nvidia-s0ix.conf
    owner: root
    group: root
    mode: "0644"
  when: power_nvidia_hw_check.rc == 0
  tags: [power, nvidia-s0ix]

- name: Remove nvidia S0ix modprobe drop-in when no NVIDIA GPU
  ansible.builtin.file:
    path: /etc/modprobe.d/nvidia-s0ix.conf
    state: absent
  when: power_nvidia_hw_check.rc != 0
  tags: [power, nvidia-s0ix]

# dracut packs /usr/lib/modprobe.d but NOT /etc/modprobe.d into the initramfs.
# Because this host force-loads nvidia in the initramfs (force_drivers), the
# S0ix/RTD3 options must be carried inside the initramfs too. install_items
# copies the file to the same absolute path in the image; dracut's modprobe
# module then applies it when force_drivers modprobes nvidia.
- name: Deploy dracut install_items conf for nvidia modprobe drop-in
  ansible.builtin.copy:
    dest: /etc/dracut.conf.d/nvidia-s0ix.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (eos-bootstrap, roles/power). Manual edits will be overwritten.
      # Ship /etc/modprobe.d/nvidia-s0ix.conf inside the initramfs so the
      # early-loaded nvidia module (force_drivers) gets its options.
      install_items+=" /etc/modprobe.d/nvidia-s0ix.conf "
  when: power_nvidia_hw_check.rc == 0
  notify: Rebuild initramfs (power)
  tags: [power, nvidia-s0ix]

- name: Remove dracut install_items conf when no NVIDIA GPU
  ansible.builtin.file:
    path: /etc/dracut.conf.d/nvidia-s0ix.conf
    state: absent
  when: power_nvidia_hw_check.rc != 0
  tags: [power, nvidia-s0ix]
