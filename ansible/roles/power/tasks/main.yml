---
# Power management via TLP (profiles require TLP >= 1.9).

- name: Read installed TLP version
  ansible.builtin.command:
    cmd: "tlp --version"
  register: power_tlp_version
  changed_when: false
  tags: [power]

- name: Assert TLP >= 1.9 for profile support
  ansible.builtin.assert:
    that:
      - (power_tlp_version.stdout | regex_search('\\d+\\.\\d+(\\.\\d+)?') | default('0.0', true)) is version('1.9', '>=')
    fail_msg: "TLP >= 1.9 is required for power profiles; found: {{ power_tlp_version.stdout }}"
  tags: [power]

- name: Deploy TLP drop-in config
  ansible.builtin.copy:
    src: tlp-eos.conf
    dest: /etc/tlp.d/00-eos.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply tlp
  tags: [power]

- name: Deploy eww power admin helper
  ansible.builtin.copy:
    src: eww-power-admin
    dest: /usr/local/sbin/eww-power-admin
    owner: root
    group: root
    mode: "0755"
  tags: [power]

- name: Sudoers drop for eww power admin
  ansible.builtin.copy:
    content: "{{ target_user }} ALL=(root) NOPASSWD: /usr/local/sbin/eww-power-admin\n"
    dest: /etc/sudoers.d/eww-power
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags: [power]

# Lid-close suspend goes through lid-watchdog (debounce) instead of
# logind: the lid switch on this laptop intermittently reports "closed"
# while the lid is open, so the stock HandleLidSwitch=suspend drops the
# machine into s2idle mid-work (black screen, i915 firmware reload logs
# on resume). See files/lid-watchdog for the full history.
- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [power]

- name: Deploy logind lid debounce drop-in (delegates lid to lid-watchdog)
  ansible.builtin.copy:
    src: logind-lid-debounce.conf
    dest: /etc/systemd/logind.conf.d/10-lid-debounce.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart logind for lid debounce
  tags: [power]

- name: Deploy lid-watchdog debounce script
  ansible.builtin.copy:
    src: lid-watchdog
    dest: /usr/local/sbin/lid-watchdog
    owner: root
    group: root
    mode: "0755"
  tags: [power]

- name: Deploy lid-watchdog service unit
  ansible.builtin.copy:
    src: lid-watchdog.service
    dest: /etc/systemd/system/lid-watchdog.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for lid-watchdog
  tags: [power]

- name: Enable and start lid-watchdog service
  ansible.builtin.systemd:
    name: lid-watchdog.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [power]
