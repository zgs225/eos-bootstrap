---
# Services every machine of this type runs. Changes require code review.
# Bluetooth is intentionally NOT here — it is enabled conditionally by
# roles/packages/tasks/bluetooth.yml based on hardware detection.
core_services:
  - NetworkManager.service
  - docker.service
  - fstrim.timer
  - keyd.service
  - rtkit-daemon.service
  - sshd.service
  - tailscaled.service
  - scx_loader.service  # sched-ext BPF scheduler loaded at boot
  - irqbalance.service  # distribute hardware IRQs across CPU cores
  - tlp.service
  - tlp-pd.service
